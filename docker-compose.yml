services:
  mysql:
    image: mysql:8.0
    container_name: krate_mysql
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: krate_db
    ports:
      - '3306:3306'
    volumes:
      - krate_mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: krate_app
    depends_on:
      mysql:
        condition: service_healthy
    env_file: .env
    environment:
      DB_HOST: mysql
    ports:
      - '3000:3000'

volumes:
  krate_mysql_data:
